services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecobilling_control
      POSTGRES_USER: ecobilling_control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecobilling_control_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecobilling_control -d ecobilling_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ecobilling_control;Username=ecobilling_control;Password=${POSTGRES_PASSWORD:-ecobilling_control_dev}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /ready, not /health (Stage 14/15): postgres reporting healthy on its own
      # (above) only proves the postgres container itself is up, not that api can
      # actually reach it over the compose network -- this is the check that would
      # catch that gap.
      test: ["CMD", "curl", "--fail", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
